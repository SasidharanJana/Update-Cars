<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Cars — Billing</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --navy-deep:#12233B;
    --navy-mid:#1D3A5F;
    --orange:#E63946;
    --amber:#FFB703;
    --paper:#F3F4F6;
    --panel:#FFFFFF;
    --ink:#1B2430;
    --slate:#5B6472;
    --border:#DDE1E6;
    --success:#2E7D5B;
    --success-bg:#E7F3EC;
    --danger:#C0392B;
    --danger-bg:#FBEAE8;
    --warn-bg:#FFF4E1;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',Arial,sans-serif;font-size:14px;}
  h1,h2,h3{font-family:'Oswald',Arial,sans-serif;font-weight:600;letter-spacing:.02em;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;font-size:13.5px;}

  .app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{width:230px;flex-shrink:0;background:var(--navy-deep);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .brand{display:flex;align-items:center;gap:10px;padding:22px 18px 18px;border-bottom:1px solid rgba(255,255,255,.1);}
  .kmark{width:36px;height:36px;background:var(--orange);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .kmark svg{width:20px;height:20px;}
  .brand-text .name{font-family:'Oswald';font-size:15px;font-weight:600;line-height:1.15;letter-spacing:.03em;}
  .brand-text .sub{font-size:9.5px;letter-spacing:.14em;color:var(--amber);margin-top:2px;}
  .nav{padding:14px 10px;flex:1;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;color:#C7D2DE;font-size:13.5px;font-weight:500;margin-bottom:2px;cursor:pointer;user-select:none;}
  .nav-item svg{width:16px;height:16px;flex-shrink:0;}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-item.active{background:var(--orange);color:#1C2530;font-weight:600;}
  .nav-foot{padding:14px 18px 18px;font-size:11px;color:#7C8DA1;border-top:1px solid rgba(255,255,255,.1);}

  /* Main */
  .main{flex:1;min-width:0;padding:26px 32px 60px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .topbar h1{font-size:22px;}
  .topbar .desc{color:var(--slate);font-size:12.5px;margin-top:3px;}
  .btn{border:none;border-radius:6px;padding:9px 16px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;}
  .btn-primary{background:var(--orange);color:#1C2530;}
  .btn-primary:hover{background:#e6860f;}
  .btn-outline{background:#fff;border:1px solid var(--border);color:var(--ink);}
  .btn-outline:hover{border-color:var(--navy-mid);}
  .btn-ghost{background:transparent;color:var(--slate);padding:6px 8px;}
  .btn-ghost:hover{color:var(--danger);}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .btn svg{width:14px;height:14px;}

  /* Cards / stats */
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .stat-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
  .stat-card .label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);font-weight:600;}
  .stat-card .value{font-family:'Oswald';font-size:26px;margin-top:6px;color:var(--navy-deep);}
  .stat-card .value.alert{color:var(--danger);}
  .stat-card .sub{font-size:11.5px;color:var(--slate);margin-top:4px;}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);}
  .panel-head h3{font-size:14px;color:var(--navy-deep);}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);font-weight:600;padding:10px 18px;background:#FAFAF7;border-bottom:1px solid var(--border);}
  td{padding:11px 18px;border-bottom:1px solid #EFEEE8;font-size:13px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FBFAF6;}
  .empty-row td{text-align:center;color:var(--slate);padding:30px;font-size:13px;}

  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .badge-paid{background:var(--success-bg);color:var(--success);}
  .badge-partial{background:var(--warn-bg);color:#95610C;}
  .badge-unpaid{background:var(--danger-bg);color:var(--danger);}
  .badge-low{background:var(--danger-bg);color:var(--danger);}
  .badge-job-inspection{background:#F1F0EA;color:var(--slate);}
  .badge-job-quote{background:#FFF4E1;color:#95610C;}
  .badge-job-approved{background:#E7F0FB;color:#1D5A9E;}
  .badge-job-in_progress{background:#FBEAE8;color:var(--orange);}
  .badge-job-completed{background:var(--success-bg);color:var(--success);}
  .badge-job-billed{background:#E8ECF3;color:var(--navy-mid);}
  .job-quote-total{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-family:'Oswald';font-size:16px;color:var(--navy-deep);}
  .badge-ok{background:var(--success-bg);color:var(--success);}

  /* Forms */
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--slate);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;}
  .field input, .field select{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--ink);}
  .field input:focus, .field select:focus{outline:none;border-color:var(--orange);}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

  .modal-bg{position:fixed;inset:0;background:rgba(18,42,68,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-bg.open{display:flex;}
  .modal{background:#fff;border-radius:12px;width:460px;max-width:100%;max-height:88vh;overflow-y:auto;padding:22px 24px;}
  .modal h2{font-size:17px;margin-bottom:16px;color:var(--navy-deep);}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}

  /* Invoice builder */
  .invoice-layout{display:grid;grid-template-columns:1fr 420px;gap:20px;align-items:start;}
  @media(max-width:1100px){.invoice-layout{grid-template-columns:1fr;}}
  .line-items{width:100%;}
  .line-items th, .line-items td{padding:8px 10px;font-size:12.5px;}
  .line-items input, .line-items select{padding:6px 7px;font-size:12.5px;}
  .add-line-btn{margin:10px 18px;}
  .totals-box{padding:14px 18px;border-top:1px solid var(--border);}
  .totals-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;color:var(--slate);}
  .totals-row.grand{font-family:'Oswald';font-size:18px;color:var(--navy-deep);border-top:1px solid var(--border);margin-top:6px;padding-top:10px;}

  /* Invoice preview (letterhead replica) */
  .invoice-preview{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;position:sticky;top:20px;}
  .ip-head{padding:18px 20px 14px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--paper);}
  .ip-proprietor{font-size:11px;color:var(--slate);}
  .ip-proprietor .pname{font-weight:700;color:var(--ink);font-size:12.5px;}
  .ip-logo{text-align:center;}
  .ip-logo .kbox{width:46px;height:46px;background:var(--orange);border-radius:8px;display:flex;align-items:center;justify-content:center;margin:0 auto 4px;}
  .ip-logo .kbox svg{width:26px;height:26px;}
  .ip-logo .cname{font-family:'Oswald';font-size:14px;color:var(--navy-deep);font-weight:700;letter-spacing:.03em;}
  .ip-logo .ctag{font-size:8.5px;letter-spacing:.12em;color:var(--slate);}
  .ip-phone{font-size:11.5px;color:var(--navy-mid);font-weight:600;text-align:right;}
  .ip-meta{display:flex;justify-content:space-between;padding:10px 20px;background:#FAFAF7;font-size:11.5px;}
  .ip-meta div span{display:block;color:var(--slate);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;}
  .ip-bill-to{padding:10px 20px;font-size:11.5px;border-bottom:1px solid #EFEEE8;}
  .ip-bill-to span{display:block;color:var(--slate);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;}
  .ip-items{width:100%;border-collapse:collapse;}
  .ip-items th{background:var(--navy-deep);color:#fff;font-size:9.5px;padding:7px 8px;text-align:left;text-transform:uppercase;letter-spacing:.04em;}
  .ip-items td{padding:7px 8px;font-size:11.5px;border-bottom:1px solid #F1F0EA;}
  .ip-items .num{text-align:right;}
  .ip-totals{padding:10px 20px 6px;}
  .ip-totals .row{display:flex;justify-content:space-between;font-size:11.5px;padding:3px 0;color:var(--slate);}
  .ip-totals .row.grand{font-family:'Oswald';font-size:16px;color:var(--navy-deep);border-top:1px solid var(--border);margin-top:4px;padding-top:8px;}
  .ip-foot{background:var(--navy-mid);color:#fff;text-align:center;padding:11px 14px;font-size:10.5px;line-height:1.5;}
  .ip-empty{padding:40px 20px;text-align:center;color:var(--slate);font-size:12px;}
  .ip-taxtitle{text-align:center;font-family:'Oswald';font-size:12.5px;letter-spacing:.18em;color:var(--navy-deep);padding:9px 0 0;font-weight:700;}
  .ip-gstrow{padding:7px 20px;font-size:10.5px;color:var(--slate);display:flex;justify-content:space-between;border-bottom:1px solid #EFEEE8;}
  .ip-words{padding:9px 20px;font-size:11px;border-top:1px solid var(--border);color:var(--ink);}
  .ip-words b{font-weight:700;}
  .ip-payment{padding:8px 20px 2px;border-top:1px dashed var(--border);}
  .ip-payment .row{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;color:var(--slate);}
  .ip-payment .row.balance{font-weight:700;color:var(--ink);font-size:12.5px;}
  .ip-status{margin:8px 20px 0;text-align:center;padding:6px;border-radius:5px;font-family:'Oswald';font-size:11.5px;letter-spacing:.08em;font-weight:700;}
  .ip-status.paid{background:var(--success-bg);color:var(--success);}
  .ip-status.partial{background:var(--warn-bg);color:#95610C;}
  .ip-status.unpaid{background:var(--danger-bg);color:var(--danger);}
  .ip-declare{padding:9px 20px;font-size:9.5px;color:var(--slate);border-top:1px solid #EFEEE8;line-height:1.5;}
  .ip-sign{padding:26px 20px 10px;text-align:right;font-size:11px;color:var(--ink);}
  .ip-sign .signfor{font-size:10px;color:var(--slate);}
  .ip-sign .signline{margin-top:34px;border-top:1px solid var(--ink);display:inline-block;padding-top:4px;font-size:10px;}

  @media print{
    @page{ margin:10mm; }
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    body > *:not(#printArea){ display:none !important; }
    #printArea{ display:block !important; }
    #printArea .invoice-preview{ border:none; box-shadow:none; width:100%; position:static; }
  }

  .search-bar{padding:12px 18px;border-bottom:1px solid var(--border);}
  .search-bar input{width:260px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--navy-deep);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:100;opacity:0;transform:translateY(8px);transition:all .25s;}
  .toast.show{opacity:1;transform:translateY(0);}
  .low-stock-tag{color:var(--danger);font-weight:600;}
  .remove-line{color:var(--danger);background:none;border:none;font-size:16px;line-height:1;padding:2px 6px;}
  .bar-row{display:flex;align-items:center;gap:10px;padding:8px 18px;}
  .bar-label{width:110px;font-size:11.5px;color:var(--slate);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{flex:1;background:#F1F0EA;border-radius:4px;height:14px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--orange);border-radius:4px;}
  .bar-value{width:100px;text-align:right;font-size:12px;font-family:'IBM Plex Mono',monospace;flex-shrink:0;}
  .backup-banner{background:var(--warn-bg);border:1px solid #F0C674;color:#7A4E08;padding:12px 16px;border-radius:8px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;gap:12px;flex-wrap:wrap;}
  .backup-banner.ok{background:var(--success-bg);border-color:#B8DFC9;color:#1E5E42;}

  /* Mobile */
  @media (max-width:860px){
    .app{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;padding:0;}
    .brand{padding:12px 14px;border-bottom:none;flex:1;}
    .brand-text .name{font-size:12.5px;}
    .nav{display:flex;overflow-x:auto;padding:4px 10px 10px;flex:1 1 100%;gap:4px;}
    .nav-item{flex-direction:column;gap:3px;padding:8px 9px;font-size:10px;white-space:nowrap;margin-bottom:0;}
    .nav-item svg{width:15px;height:15px;}
    .nav-foot{display:none;}
    .main{padding:16px 14px 40px;}
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .grid-2,.grid-3{grid-template-columns:1fr;}
    .topbar{flex-direction:column;align-items:stretch;}
    .topbar .btn, .topbar > div:last-child{width:100%;justify-content:center;}
    .panel table{display:block;overflow-x:auto;white-space:nowrap;}
    .invoice-preview{position:static;}
    .modal{width:100%;}
  }
  @media (max-width:480px){
    .stat-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">
      <img src="./logo.png" alt="Update Cars" style="width:150px;height:auto;display:block">
    </div>
    <div class="nav" id="nav">
      <div class="nav-item" data-view="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Dashboard</div>
      <div class="nav-item" data-view="jobs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6a1 1 0 011 1v1H8V4a1 1 0 011-1z"/><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 12h6M9 16h4"/></svg>Jobs</div>

    </div>
    <div class="nav-foot">CAR REPAIRS<br>SPARES · CAR WASH</div>
  </div>

  <div class="main" id="main">
    <!-- rendered by JS -->
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>
<div id="printArea" style="display:none"></div>

<script>
/* ---------------- Storage helpers ---------------- */
const KEYS = { settings:'updatecars:settings', customers:'updatecars:customers', products:'updatecars:products', invoices:'updatecars:invoices', jobs:'updatecars:jobs' };

async function storeGet(key, fallback){
  try{
    const r = await window.storage.get(key, false);
    return r ? JSON.parse(r.value) : fallback;
  }catch(e){ return fallback; }
}
async function storeSet(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), false); }
  catch(e){ console.error('storage set failed', e); showToast('Save failed — storage error'); }
}

let DB = { settings:null, customers:[], products:[], invoices:[], jobs:[] };
let view = 'dashboard';

const defaultSettings = {
  companyName:'UPDATE CARS',
  tagline:'CAR REPAIRS · SPARE PARTS · CAR WASH',
  proprietor:'',
  phone:'',
  address:'Flyover, Sandaipet, Kondalampatti, Salem, Tamil Nadu 636010',
  gstin:'',
  state:'Tamil Nadu',
  stateCode:'33',
  cgstRate:9,
  sgstRate:9,
  invoiceCounter:1,
  invoicePrefix:'UC',
  cloudBackupUrl:'',
  lastBackupAt:null
};

const defaultProducts = [
  {id:cryptoId(), category:'part', name:'Engine Oil (4L, 5W-30)', hsn:'2710', unit:'nos', rate:1800, stock:0, lowStock:5},
  {id:cryptoId(), category:'part', name:'Oil Filter', hsn:'8421', unit:'nos', rate:350, stock:0, lowStock:10},
  {id:cryptoId(), category:'part', name:'Brake Pad Set (Front)', hsn:'8708', unit:'set', rate:1500, stock:0, lowStock:5},
  {id:cryptoId(), category:'part', name:'Air Filter', hsn:'8421', unit:'nos', rate:450, stock:0, lowStock:10},
  {id:cryptoId(), category:'part', name:'Wiper Blade', hsn:'8512', unit:'pair', rate:600, stock:0, lowStock:8},
  {id:cryptoId(), category:'service', name:'General Service (Labor)', hsn:'9987', unit:'job', rate:800},
  {id:cryptoId(), category:'service', name:'Wheel Alignment', hsn:'9987', unit:'job', rate:500},
  {id:cryptoId(), category:'service', name:'Car Wash — Basic', hsn:'9987', unit:'wash', rate:250},
  {id:cryptoId(), category:'service', name:'Car Wash — Premium (Interior + Exterior)', hsn:'9987', unit:'wash', rate:600},
];

function cryptoId(){ return 'id-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function fmtMoney(n){ n = Number(n)||0; return '₹' + n.toLocaleString('en-IN', {maximumFractionDigits:2, minimumFractionDigits:2}); }
function fmtDate(d){ const dt = new Date(d); return dt.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysSince(dateStr){ if(!dateStr) return Infinity; return Math.floor((Date.now()-new Date(dateStr).getTime())/86400000); }

function numToWords(n){
  const a = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function two(n){ if(n<20) return a[n]; return b[Math.floor(n/10)] + (n%10 ? ' '+a[n%10] : ''); }
  function three(n){ if(n>99) return a[Math.floor(n/100)]+' Hundred'+(n%100 ? ' '+two(n%100) : ''); return two(n); }
  if(n===0) return 'Zero';
  let crore = Math.floor(n/10000000); n%=10000000;
  let lakh = Math.floor(n/100000); n%=100000;
  let thousand = Math.floor(n/1000); n%=1000;
  let rest = n;
  let parts=[];
  if(crore) parts.push(three(crore)+' Crore');
  if(lakh) parts.push(three(lakh)+' Lakh');
  if(thousand) parts.push(three(thousand)+' Thousand');
  if(rest) parts.push(three(rest));
  return parts.join(' ');
}
function amountInWords(total){
  total = Math.max(0, Number(total)||0);
  const rupees = Math.floor(total);
  const paise = Math.round((total-rupees)*100);
  let words = 'Rupees ' + numToWords(rupees);
  if(paise>0) words += ' and ' + numToWords(paise) + ' Paise';
  return words + ' Only';
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2400);
}

async function boot(){
  DB.settings = await storeGet(KEYS.settings, null);
  DB.settings = Object.assign({}, defaultSettings, DB.settings || {});
  await storeSet(KEYS.settings, DB.settings);
  DB.customers = await storeGet(KEYS.customers, []);
  DB.products = await storeGet(KEYS.products, null);
  if(!DB.products){ DB.products = defaultProducts; await storeSet(KEYS.products, DB.products); }
  DB.invoices = await storeGet(KEYS.invoices, []);
  DB.jobs = await storeGet(KEYS.jobs, []);

  document.getElementById('nav').addEventListener('click', (e)=>{
    const item = e.target.closest('.nav-item');
    if(!item) return;
    setView(item.dataset.view);
  });

  setView('dashboard');
}

function setView(v, param){
  view = v;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.view===v));
  render(param);
}

function render(param){
  const main = document.getElementById('main');
  if(view==='dashboard') main.innerHTML = renderDashboard();
  else if(view==='jobs') main.innerHTML = renderJobs();
  else if(view==='jobDetail') { renderJobDetail(param); return; }
  else if(view==='invoices') main.innerHTML = renderInvoiceList();
  else if(view==='newInvoice') { main.innerHTML = renderInvoiceBuilder(); bindInvoiceBuilder(); return; }
  else if(view==='customers') main.innerHTML = renderCustomers();
  else if(view==='inventory') main.innerHTML = renderInventory();
  else if(view==='services') main.innerHTML = renderServices();
  else if(view==='dues') main.innerHTML = renderDues();
  else if(view==='reports') main.innerHTML = renderReports();
  else if(view==='settings') main.innerHTML = renderSettings();
  else if(view==='viewInvoice') { renderInvoiceDetail(param); return; }
  bindMainEvents();
}

/* ---------------- Derived data ---------------- */
function invoiceBalance(inv){
  const paid = (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
  return Math.max(0, inv.total - paid);
}
function invoiceStatus(inv){
  const bal = invoiceBalance(inv);
  if(bal<=0.004) return 'paid';
  if(bal < inv.total) return 'partial';
  return 'unpaid';
}
function customerName(id){
  const c = DB.customers.find(x=>x.id===id);
  return c ? c.name : '—';
}

async function saveNewJob(){
  const name = document.getElementById('jCustName').value.trim();
  if(!name){ showToast('Client name is required'); return; }
  let custId = document.getElementById('jCustSelect').value || null;
  const custSnapshot = { name, phone:document.getElementById('jCustPhone').value.trim(), address:'', gstin:'' };
  if(!custId){
    const existing = DB.customers.find(c=>c.id===custId);
    if(!existing){
      const newCust = { id:cryptoId(), ...custSnapshot };
      DB.customers.push(newCust);
      await storeSet(KEYS.customers, DB.customers);
      custId = newCust.id;
    }
  } else {
    const c = DB.customers.find(x=>x.id===custId);
    if(c){ custSnapshot.address = c.address; custSnapshot.gstin = c.gstin; }
  }

  const jobNo = `JB-${String(DB.jobs.length+1).padStart(4,'0')}`;
  const job = {
    id:cryptoId(), jobNo, date:todayISO(), customerId:custId, customerSnapshot:custSnapshot,
    vehicle:{ regNo:document.getElementById('jVehRegNo').value.trim(), makeModel:document.getElementById('jVehMakeModel').value.trim(), odometer:document.getElementById('jVehOdometer').value },
    complaint:document.getElementById('jComplaint').value.trim(),
    inspectionNotes:'', status:'inspection', items:[], invoiceId:null
  };
  DB.jobs.push(job);
  await storeSet(KEYS.jobs, DB.jobs);
  closeModal();
  showToast('Job ' + jobNo + ' started');
  setView('jobDetail', job.id);
}

function bindJobDetail(){
  const job = currentJob;
  if(!job.items.length) job.items = [{productId:'',name:'',hsn:'',qty:1,unit:'',rate:0}];

  document.getElementById('jobComplaint').addEventListener('change', async e=>{
    job.complaint = e.target.value;
    await storeSet(KEYS.jobs, DB.jobs);
  });
  document.getElementById('jobNotes').addEventListener('change', async e=>{
    job.inspectionNotes = e.target.value;
    await storeSet(KEYS.jobs, DB.jobs);
  });

  document.getElementById('jobLineBody').addEventListener('change', async e=>{
    const idx = e.target.dataset.idx;
    if(idx===undefined) return;
    const it = job.items[idx];
    if(e.target.classList.contains('jline-product')){
      const p = DB.products.find(x=>x.id===e.target.value);
      if(p){ it.productId=p.id; it.name=p.name; it.hsn=p.hsn; it.unit=p.unit; it.rate=p.rate; }
      else { it.productId=''; }
      await storeSet(KEYS.jobs, DB.jobs);
      renderJobDetail(job.id);
      return;
    }
    if(e.target.classList.contains('jline-qty')) it.qty = e.target.value;
    if(e.target.classList.contains('jline-unit')) it.unit = e.target.value;
    if(e.target.classList.contains('jline-rate')) it.rate = e.target.value;
    await storeSet(KEYS.jobs, DB.jobs);
    updateJobTotalsDisplay();
  });
  document.getElementById('jobLineBody').addEventListener('input', async e=>{
    const idx = e.target.dataset.idx;

    const it = job.items[idx];
    if(e.target.classList.contains('jline-qty')) it.qty = e.target.value;
    if(e.target.classList.contains('jline-unit')) it.unit = e.target.value;
    if(e.target.classList.contains('jline-rate')) it.rate = e.target.value;
    await storeSet(KEYS.jobs, DB.jobs);
    updateJobTotalsDisplay();
  });
}

        }).join('') : `<tr class="empty-row"><td colspan="9">No bills yet.</td></tr>`}
      </tbody>
    </table>
  </div>`;
}

const DOC_LABELS = { job:'Job Card (Repair)', parts:'Parts Sale', wash:'Car Wash Ticket', combined:'Combined Bill' };
const DOC_PREFIX = { job:'JC', parts:'PS', wash:'CW', combined:'CB' };
function newDraft(docType){
  return { docType: docType||'parts', customerId:null, customerSnapshot:null, date: todayISO(),
    vehicle: {regNo:'', makeModel:'', odometer:''},
    items:[ {productId:'', name:'', hsn:'', qty:1, unit:'', rate:0} ],
    cgstRate: DB.settings.cgstRate, sgstRate: DB.settings.sgstRate,
    paid:0, paidMode:'Cash' };
}

function lineAmount(it){
  return (Number(it.qty)||0) * (Number(it.rate)||0);
}

function computeTotals(d){
  const subtotal = d.items.reduce((s,it)=> s + lineAmount(it), 0);
  const cgstAmt = subtotal * (Number(d.cgstRate)||0)/100;
  const sgstAmt = subtotal * (Number(d.sgstRate)||0)/100;
  const total = subtotal + cgstAmt + sgstAmt;
  return {subtotal, cgstAmt, sgstAmt, total};
}

function bindInvoiceBuilder(){
  const $ = sel => document.querySelector(sel);

  $('#custSelect').addEventListener('change', e=>{
    const c = DB.customers.find(x=>x.id===e.target.value);
    draft.customerId = c ? c.id : null;
    draft.customerSnapshot = c ? {name:c.name, phone:c.phone, address:c.address, gstin:c.gstin} : draft.customerSnapshot;
    render();
  });
  ['custName','custPhone','custAddress','custGstin'].forEach(id=>{
    $('#'+id).addEventListener('input', e=>{
      if(!draft.customerSnapshot) draft.customerSnapshot = {name:'',phone:'',address:'',gstin:''};
      const map = {custName:'name',custPhone:'phone',custAddress:'address',custGstin:'gstin'};
      draft.customerSnapshot[map[id]] = e.target.value;
      updatePreviewOnly();
    });
  });
  $('#invDate').addEventListener('change', e=>{ draft.date = e.target.value; updatePreviewOnly(); });
  if(document.getElementById('vehRegNo')){
    ['vehRegNo','vehMakeModel','vehOdometer'].forEach(id=>{
      document.getElementById(id).addEventListener('input', e=>{
        if(!draft.vehicle) draft.vehicle = {regNo:'',makeModel:'',odometer:''};
        const map = {vehRegNo:'regNo', vehMakeModel:'makeModel', vehOdometer:'odometer'};
        draft.vehicle[map[id]] = e.target.value;
        updatePreviewOnly();
      });
    });
  }
  $('#cgstRate').addEventListener('input', e=>{ draft.cgstRate = e.target.value; renderKeepScroll(); });
  $('#sgstRate').addEventListener('input', e=>{ draft.sgstRate = e.target.value; renderKeepScroll(); });
  $('#paidNow').addEventListener('input', e=>{ draft.paid = e.target.value; updatePreviewOnly(); });
  $('#paidMode').addEventListener('change', e=>{ draft.paidMode = e.target.value; });

  document.getElementById('lineBody').addEventListener('change', e=>{
    const idx = e.target.dataset.idx;
    if(idx===undefined) return;
    const it = draft.items[idx];
    if(e.target.classList.contains('line-product')){
      const p = DB.products.find(x=>x.id===e.target.value);
      if(p){ it.productId=p.id; it.name=p.name; it.hsn=p.hsn; it.unit=p.unit; it.rate=p.rate; }
      else { it.productId=''; }
      renderKeepScroll();
    }
    if(e.target.classList.contains('line-hsn')) it.hsn = e.target.value;
    if(e.target.classList.contains('line-qty')) it.qty = e.target.value;
    if(e.target.classList.contains('line-unit')) it.unit = e.target.value;
    if(e.target.classList.contains('line-rate')) it.rate = e.target.value;
    if(!e.target.classList.contains('line-product')) updatePreviewOnly();
    else updateTotalsRow();
  });
  document.getElementById('lineBody').addEventListener('input', e=>{
    const idx = e.target.dataset.idx;
    if(idx===undefined) return;
    const it = draft.items[idx];
    if(e.target.classList.contains('line-hsn')) it.hsn = e.target.value;
    if(e.target.classList.contains('line-unit')) it.unit = e.target.value;
    if(e.target.classList.contains('line-qty')) it.qty = e.target.value;
    if(e.target.classList.contains('line-rate')) it.rate = e.target.value;
    updateTotalsRow();
  });
}

function draftPayInfo(t){
  const paid = Number(draft.paid)||0;
  const balance = Math.max(0, t.total - paid);
  const status = balance<=0.004 && t.total>0 ? 'paid' : (paid>0 ? 'partial' : 'unpaid');
  return {paid, balance, status};
}

function updateTotalsRow(){
  const t = computeTotals(draft);
  document.querySelectorAll('.totals-row.grand span.mono')[0].textContent = fmtMoney(t.total);
  const rows = document.querySelectorAll('.totals-box .totals-row .mono');
  rows[0].textContent = fmtMoney(t.subtotal);
  rows[1].textContent = fmtMoney(t.cgstAmt);
  rows[2].textContent = fmtMoney(t.sgstAmt);
  rows[3].textContent = fmtMoney(t.total);
  document.querySelectorAll('#lineBody tr').forEach((tr,idx)=>{
    const it = draft.items[idx];
    tr.querySelector('.line-amount').textContent = fmtMoney(lineAmount(it));
  });
  updatePreviewOnly();
}
function updatePreviewOnly(){
  const t = computeTotals(draft);
  const container = document.querySelector('.invoice-layout > div:last-child');
  container.innerHTML = renderLivePreview(draft, t, draftPayInfo(t));
}
function renderKeepScroll(){
  const y = window.scrollY;
  render();
  window.scrollTo(0,y);
  bindInvoiceBuilder();
}

/* ================= REPORTS ================= */
function buildMonthlySeries(n){
  const now = new Date();
  const months = [];
  for(let i=n-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({year:d.getFullYear(), month:d.getMonth(), label:d.toLocaleDateString('en-IN',{month:'short',year:'2-digit'}), revenue:0, collected:0});
  }
  DB.invoices.forEach(inv=>{
    const d = new Date(inv.date);
    const m = months.find(mm=>mm.year===d.getFullYear() && mm.month===d.getMonth());
    if(m){ m.revenue += inv.total; m.collected += (inv.total - invoiceBalance(inv)); }
  });
  return months;
}
function topProducts(limit){
  const map = {};
  DB.invoices.forEach(inv=> (inv.items||[]).forEach(it=>{
    const key = it.name || 'Unnamed item';
    map[key] = (map[key]||0) + lineAmount(it);
  }));
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,limit);
}
function topCustomers(limit){
  const map = {};
  DB.invoices.forEach(inv=>{
    const key = inv.customerSnapshot?.name || customerName(inv.customerId) || 'Unknown';
    map[key] = (map[key]||0) + inv.total;
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,limit);
}

function renderReports(){
  const totalRevenue = DB.invoices.reduce((s,i)=>s+i.total,0);
  const totalDue = DB.invoices.reduce((s,i)=>s+invoiceBalance(i),0);
  const totalCollected = totalRevenue - totalDue;
  const avgInvoice = DB.invoices.length ? totalRevenue/DB.invoices.length : 0;

  const months = buildMonthlySeries(6);
  const maxRev = Math.max(...months.map(m=>m.revenue), 1);
  const products = topProducts(5);
  const maxProd = Math.max(...products.map(p=>p[1]), 1);
  const customers = topCustomers(5);
  const maxCust = Math.max(...customers.map(c=>c[1]), 1);

  return `
  <div class="topbar">
    <div><h1>Reports</h1><div class="desc">Historical trends across all invoices</div></div>
    <button class="btn btn-outline" data-action="export-csv">Export Invoices (CSV)</button>
  </div>

  <div class="stat-row">
    <div class="stat-card"><div class="label">Total Revenue</div><div class="value">${fmtMoney(totalRevenue)}</div><div class="sub">${DB.invoices.length} invoice${DB.invoices.length===1?'':'s'}</div></div>
    <div class="stat-card"><div class="label">Total Collected</div><div class="value">${fmtMoney(totalCollected)}</div></div>
    <div class="stat-card"><div class="label">Total Outstanding</div><div class="value ${totalDue>0?'alert':''}">${fmtMoney(totalDue)}</div></div>
    <div class="stat-card"><div class="label">Avg. Invoice Value</div><div class="value">${fmtMoney(avgInvoice)}</div></div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>Revenue — Last 6 Months</h3></div>
    ${months.map(m=>`
      <div class="bar-row">
        <div class="bar-label">${m.label}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(m.revenue/maxRev*100).toFixed(1)}%"></div></div>
        <div class="bar-value mono">${fmtMoney(m.revenue)}</div>
      </div>`).join('')}
  </div>

  <div class="panel">
    <div class="panel-head"><h3>Top Parts & Services by Revenue</h3></div>
    ${products.length ? products.map(([name,val])=>`
      <div class="bar-row">
        <div class="bar-label" title="${name}">${name}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(val/maxProd*100).toFixed(1)}%"></div></div>
        <div class="bar-value mono">${fmtMoney(val)}</div>
      </div>`).join('') : `<div style="padding:20px;text-align:center;color:var(--slate);font-size:13px">No data yet.</div>`}
  </div>

  <div class="panel">
    <div class="panel-head"><h3>Top Customers by Revenue</h3></div>
    ${customers.length ? customers.map(([name,val])=>`
      <div class="bar-row">
        <div class="bar-label" title="${name}">${name}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(val/maxCust*100).toFixed(1)}%"></div></div>
        <div class="bar-value mono">${fmtMoney(val)}</div>
      </div>`).join('') : `<div style="padding:20px;text-align:center;color:var(--slate);font-size:13px">No data yet.</div>`}

function exportInvoicesCSV(){
  const esc = v => { v = String(v); return (v.includes(',')||v.includes('"')||v.includes('\\n')) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const rows = [['Invoice No','Type','Date','Customer','Phone','Vehicle No','Item','HSN/SAC','Qty','Unit','Rate','Line Amount','CGST %','SGST %','Invoice Subtotal','Invoice CGST Amt','Invoice SGST Amt','Invoice Total','Paid','Balance','Status']];
  DB.invoices.forEach(inv=>{
    const bal = invoiceBalance(inv);
    const status = invoiceStatus(inv);
    (inv.items||[]).forEach(it=>{
      rows.push([inv.number, DOC_LABELS[inv.docType]||'', inv.date, inv.customerSnapshot?.name||'', inv.customerSnapshot?.phone||'', inv.vehicle?.regNo||'', it.name, it.hsn, it.qty, it.unit,
        it.rate, lineAmount(it).toFixed(2), inv.cgstRate, inv.sgstRate,
        inv.subtotal.toFixed(2), inv.cgstAmt.toFixed(2), inv.sgstAmt.toFixed(2), inv.total.toFixed(2),
        (inv.total-bal).toFixed(2), bal.toFixed(2), status]);
    });
  });
  const csv = rows.map(r=>r.map(esc).join(',')).join('\\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `updatecars-bills-${todayISO()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('CSV exported');
}

function bindMainEvents(){
  document.body.onclick = async (e)=>{
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;
    const id = el.dataset.id;

    if(action==='go-new-invoice'){ draft = newDraft(el.dataset.doctype||'parts'); setView('newInvoice'); }
    else if(action==='go-invoices'){ draft=null; setView('invoices'); }
    else if(action==='go-jobs'){ setView('jobs'); }
    else if(action==='new-job'){ newJobModal(); }
    else if(action==='save-new-job'){ await saveNewJob(); }
    else if(action==='view-job'){ setView('jobDetail', id); }
    else if(action==='add-job-line'){ await addJobLine(); }
    else if(action==='remove-job-line'){ await removeJobLine(Number(el.dataset.idx)); }
    else if(action==='advance-job-status'){ await advanceJobStatus(id); }
    else if(action==='generate-bill-from-job'){ generateBillFromJob(id); }
    else if(action==='cancel-invoice'){ draft=null; pendingJobId=null; setView('invoices'); }
    else if(action==='view-invoice'){ setView('viewInvoice', id); }
    else if(action==='add-line'){ draft.items.push({productId:'',name:'',hsn:'',qty:1,unit:'',rate:0}); renderKeepScroll(); }
    else if(action==='remove-line'){ draft.items.splice(Number(el.dataset.idx),1); if(!draft.items.length) draft.items.push({productId:'',name:'',hsn:'',qty:1,unit:'',rate:0}); renderKeepScroll(); }
    else if(action==='save-invoice'){ await saveInvoice(); }
    else if(action==='add-customer'){ customerModal(); }
    else if(action==='save-new-customer'){ await saveNewCustomer(); }
    else if(action==='delete-customer'){ if(confirm('Delete this customer?')){ DB.customers = DB.customers.filter(c=>c.id!==id); await storeSet(KEYS.customers, DB.customers); render(); showToast('Customer deleted'); } }
    else if(action==='add-product'){ productModal(el.dataset.cat); }
    else if(action==='save-new-product'){ await saveNewProduct(); }
    else if(action==='delete-product'){ if(confirm('Delete this product?')){ DB.products = DB.products.filter(p=>p.id!==id); await storeSet(KEYS.products, DB.products); render(); showToast('Product deleted'); } }
    else if(action==='restock-product'){ restockModal(id); }
    else if(action==='confirm-restock'){ await confirmRestock(id); }
    else if(action==='record-payment'){ paymentModal(id); }
    else if(action==='confirm-payment'){ await confirmPayment(id); }
    else if(action==='delete-payment'){ await deletePayment(id, Number(el.dataset.idx)); }
    else if(action==='close-modal'){ closeModal(); }
    else if(action==='save-settings'){ await saveSettings(); }
    else if(action==='print-invoice'){ printInvoice(); }
    else if(action==='export-backup'){ await exportBackup(); }
    else if(action==='export-csv'){ exportInvoicesCSV(); }
    else if(action==='cloud-backup-now'){ DB.settings.cloudBackupUrl = document.getElementById('setCloudUrl').value.trim(); await storeSet(KEYS.settings, DB.settings); await cloudBackup(false); }
  };
  const importInput = document.getElementById('importFile');
  if(importInput) importInput.onchange = (e)=>{ if(e.target.files[0]) importBackup(e.target.files[0]); };
}

async function exportBackup(silent){
  const payload = { settings:DB.settings, customers:DB.customers, products:DB.products, invoices:DB.invoices, jobs:DB.jobs, exportedAt:new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `updatecars-billing-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  DB.settings.lastBackupAt = new Date().toISOString();
  await storeSet(KEYS.settings, DB.settings);
  if(!silent) showToast('Backup downloaded');
  if(view==='dashboard') render();
}

async function cloudBackup(silent){
  const url = DB.settings.cloudBackupUrl;
  if(!url){ if(!silent) showToast('Add a cloud backup URL in Settings first'); return; }
  const payload = { settings:DB.settings, customers:DB.customers, products:DB.products, invoices:DB.invoices, jobs:DB.jobs, exportedAt:new Date().toISOString() };
  try{
    await fetch(url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
    DB.settings.lastBackupAt = new Date().toISOString();
    await storeSet(KEYS.settings, DB.settings);
    if(!silent) showToast('Cloud backup sent — check your Drive folder to confirm');
    if(view==='dashboard'||view==='settings') render();
  }catch(e){
    if(!silent) showToast('Cloud backup failed — check the URL and your connection');
  }
}

async function importBackup(file){
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data.settings || !data.customers || !data.products || !data.invoices) throw new Error('bad file');
    if(!confirm('This will replace all current data with the backup. Continue?')) return;
    DB.settings = data.settings; DB.customers = data.customers; DB.products = data.products; DB.invoices = data.invoices; DB.jobs = data.jobs || [];
    await storeSet(KEYS.settings, DB.settings);
    await storeSet(KEYS.customers, DB.customers);
    await storeSet(KEYS.products, DB.products);
    await storeSet(KEYS.invoices, DB.invoices);
    await storeSet(KEYS.jobs, DB.jobs);
    showToast('Backup restored');
    setView('dashboard');
  }catch(e){ showToast('Could not read that backup file'); }
}

async function saveInvoice(){
  if(!draft.customerSnapshot || !draft.customerSnapshot.name){
    showToast('Enter a customer name first'); return;
  }
  const validItems = draft.items.filter(it=> (it.name||it.productId) && Number(it.qty)>0 );
  if(!validItems.length){ showToast('Add at least one line item'); return; }

  const t = computeTotals(draft);
  let custId = draft.customerId;
  if(!custId){
    const newCust = { id:cryptoId(), name:draft.customerSnapshot.name, phone:draft.customerSnapshot.phone||'', address:draft.customerSnapshot.address||'', gstin:draft.customerSnapshot.gstin||'' };
    DB.customers.push(newCust);
    await storeSet(KEYS.customers, DB.customers);
    custId = newCust.id;
  }

  const number = `${DOC_PREFIX[draft.docType]||DB.settings.invoicePrefix}-${String(DB.settings.invoiceCounter).padStart(4,'0')}`;
  const inv = {
    id:cryptoId(), number, docType:draft.docType, date:draft.date, customerId:custId, customerSnapshot:draft.customerSnapshot,
    vehicle: (draft.docType==='job'||draft.docType==='wash') ? draft.vehicle : null,
    items: validItems.map(it=>({...it, qty:Number(it.qty), rate:Number(it.rate)})),
    subtotal:t.subtotal, cgstRate:Number(draft.cgstRate), sgstRate:Number(draft.sgstRate),
    cgstAmt:t.cgstAmt, sgstAmt:t.sgstAmt, total:t.total,
    payments: Number(draft.paid)>0 ? [{date:draft.date, amount:Number(draft.paid), mode:draft.paidMode}] : []
  };
  DB.invoices.push(inv);
  await storeSet(KEYS.invoices, DB.invoices);

  // reduce stock only for matched Parts (services have no stock)
  validItems.forEach(it=>{
    if(it.productId){
      const p = DB.products.find(x=>x.id===it.productId);
      if(p && p.category!=='service') p.stock = Math.max(0, (Number(p.stock)||0) - Number(it.qty));
    }
  });
  await storeSet(KEYS.products, DB.products);

  DB.settings.invoiceCounter += 1;
  await storeSet(KEYS.settings, DB.settings);

  if(pendingJobId){
    const job = DB.jobs.find(j=>j.id===pendingJobId);
    if(job){ job.status = 'billed'; job.invoiceId = inv.id; await storeSet(KEYS.jobs, DB.jobs); }
    pendingJobId = null;
  }

  draft = null;
  showToast(DOC_LABELS[inv.docType] + ' ' + number + ' saved');
  setView('viewInvoice', inv.id);
  cloudBackup(true);
}

async function confirmPayment(id){
  const amt = Number(document.getElementById('mAmt').value)||0;
  if(amt<=0){ showToast('Enter a valid amount'); return; }
  const inv = DB.invoices.find(i=>i.id===id);
  inv.payments.push({ date:document.getElementById('mDate').value, amount:amt, mode:document.getElementById('mMode').value });
  await storeSet(KEYS.invoices, DB.invoices);
  closeModal();
  showToast('Payment recorded');
  setView('viewInvoice', id);
  cloudBackup(true);
}

async function deletePayment(invId, idx){
  if(!confirm('Remove this payment entry?')) return;
  const inv = DB.invoices.find(i=>i.id===invId);
  inv.payments.splice(idx,1);
  await storeSet(KEYS.invoices, DB.invoices);
  showToast('Payment removed');
  setView('viewInvoice', invId);
}

async function saveSettings(){
  DB.settings.companyName = document.getElementById('setCompany').value;
  DB.settings.proprietor = document.getElementById('setProprietor').value;
  DB.settings.phone = document.getElementById('setPhone').value;
  DB.settings.gstin = document.getElementById('setGstin').value;
  DB.settings.address = document.getElementById('setAddress').value;
  DB.settings.state = document.getElementById('setState').value;
  DB.settings.stateCode = document.getElementById('setStateCode').value;
  DB.settings.cgstRate = Number(document.getElementById('setCgst').value)||0;
  DB.settings.sgstRate = Number(document.getElementById('setSgst').value)||0;
  DB.settings.invoicePrefix = document.getElementById('setPrefix').value || 'KI';
  DB.settings.cloudBackupUrl = document.getElementById('setCloudUrl') ? document.getElementById('setCloudUrl').value.trim() : DB.settings.cloudBackupUrl;
  await storeSet(KEYS.settings, DB.settings);
  showToast('Settings saved');
}

function printInvoice(){
  const preview = document.querySelector('.invoice-preview');
  const printArea = document.getElementById('printArea');
  if(!preview || !printArea){ window.print(); return; }
  printArea.innerHTML = preview.outerHTML;
  window.print();
}

boot();
</script>
